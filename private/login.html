<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SafetyRAG · Private Sign In</title>
  <style>
    body{background:#edf4f8;display:grid;place-items:center;min-height:100vh;font:16px system-ui;color:#18334f;margin:0}
    .panel{width:min(92vw,420px);background:#fff;border:1px solid #dce6ef;border-radius:20px;padding:35px;box-shadow:0 15px 45px #10284518}
    h1{font-size:24px}
    label{display:block;font-weight:650;margin:20px 0 7px}
    input,button{width:100%;padding:13px;border-radius:10px;font:inherit}
    input{border:1px solid #c4d3e0}
    button{margin-top:15px;background:#0b7d90;color:white;border:0;font-weight:750;cursor:pointer}
    a{color:#0b7d90}
    .small{font-size:13px;color:#60728a}
    .error{color:#b91c1c}
  </style>
  <div class="panel">
    <p class="small">🔒 Academic Research Portfolio</p>
    <h1>Private Research Workspace</h1>
    <p class="small">The dissertation master checklist is not included in the public website files.</p>
    <form method="post" action="/login">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button>Unlock master plan</button>
    </form>
    <p class="small">Your password is read from a local file outside the public directory.</p>
    <a href="/">← Public portfolio</a>
  </div>
</html>
